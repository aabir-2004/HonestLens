services:
  - type: web
    name: honestlens-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: honestlens-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: honestlens-db
    databaseName: honestlens
    user: honestlens_user
    plan: free